name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# A newer run for the same ref supersedes the one in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Names the built module artifact after the run and the commit so it is obvious where it came from.
  MODULE_ARTIFACT: specialK-module-run${{ github.run_number }}-${{ github.sha }}

defaults:
  run:
    shell: pwsh

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-lint-${{ runner.os }}-${{ hashFiles('repoScripts/Install-BuildDependency.ps1') }}

      - name: Install PSScriptAnalyzer
        run: ./repoScripts/Install-BuildDependency.ps1 -Name PSScriptAnalyzer

      - name: Analyze
        run: ./repoScripts/Invoke-Lint.ps1

  test:
    name: Build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: psmodules-test-${{ runner.os }}-${{ hashFiles('repoScripts/Install-BuildDependency.ps1') }}

      - name: Install InvokeBuild and Pester
        run: ./repoScripts/Install-BuildDependency.ps1 -Name InvokeBuild, Pester

      - name: Build the module
        run: Invoke-Build ModuleBuild

      - name: Unit tests
        run: Invoke-Build Test -TestResultPath ./testResults/unit-${{ matrix.os }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}
          path: testResults/*.xml
          if-no-files-found: warn

      - name: Upload built module
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_ARTIFACT }}
          path: build/specialK
          if-no-files-found: error

  smoke:
    name: Smoke test (Kubernetes ${{ matrix.kubernetes }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Node images published for the pinned kind release (kind v0.30.0); kubectl client matches the cluster.
        kubernetes: [v1.32.8, v1.33.4, v1.34.0]
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-smoke-${{ runner.os }}-${{ hashFiles('repoScripts/Install-BuildDependency.ps1') }}

      - name: Install InvokeBuild and Pester
        run: ./repoScripts/Install-BuildDependency.ps1 -Name InvokeBuild, Pester

      - name: Download the built module
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MODULE_ARTIFACT }}
          path: build/specialK

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          node_image: kindest/node:${{ matrix.kubernetes }}
          kubectl_version: ${{ matrix.kubernetes }}
          cluster_name: specialk-smoke

      - name: Show cluster and kubectl versions
        run: kubectl version

      - name: Install metrics-server
        run: |
          $ErrorActionPreference = 'Stop'
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply the metrics-server manifest.' }
          # kind's kubelets use self-signed certificates
          kubectl patch deployment metrics-server -n kube-system --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not patch metrics-server with --kubelet-insecure-tls.' }
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw 'metrics-server did not become ready within 180s.' }
          $deadline = (Get-Date).AddSeconds(180)
          do {
            kubectl top node *> $null
            if ($LASTEXITCODE -eq 0) { Write-Output 'Metrics API is serving.'; return }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          throw 'The Metrics API did not start serving node metrics within 180s.'

      - name: Smoke test
        run: Invoke-Build SmokeTest -TestResultPath ./testResults/smoke-${{ matrix.kubernetes }}.xml

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp
          kubectl top node
          kubectl logs -n kube-system deployment/metrics-server --tail=50

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-${{ matrix.kubernetes }}
          path: testResults/*.xml
          if-no-files-found: warn
